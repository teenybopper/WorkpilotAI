<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleCyanGradDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Left Side: W neural logo -->
  <g transform="translate(10, 0)">
    <!-- Glow layer for background ambiance -->
    <path d="M 30,30 L 55,95 L 80,25 L 105,95 L 130,30" fill="none" stroke="url(#purpleCyanGradDark)" stroke-width="6" opacity="0.15" filter="url(#glow)" />
    
    <!-- Connections -->
    <line x1="30" y1="30" x2="40" y2="45" stroke="url(#purpleCyanGradDark)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9" />
    <line x1="40" y1="45" x2="50" y2="65" stroke="url(#purpleCyanGradDark)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9" />
    <line x1="50" y1="65" x2="55" y2="95" stroke="url(#purpleCyanGradDark)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9" />
    <line x1="30" y1="30" x2="55" y2="95" stroke="url(#purpleCyanGradDark)" stroke-width="1.5" stroke-dasharray="2,2" stroke-opacity="0.45" />
    
    <line x1="55" y1="95" x2="75" y2="55" stroke="url(#purpleCyanGradDark)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9" />
    <line x1="75" y1="55" x2="80" y2="25" stroke="url(#purpleCyanGradDark)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9" />
    <line x1="80" y1="25" x2="85" y2="55" stroke="url(#purpleCyanGradDark)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9" />
    <line x1="85" y1="55" x2="105" y2="95" stroke="url(#purpleCyanGradDark)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9" />
    
    <line x1="105" y1="95" x2="110" y2="65" stroke="url(#purpleCyanGradDark)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9" />
    <line x1="110" y1="65" x2="120" y2="45" stroke="url(#purpleCyanGradDark)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9" />
    <line x1="120" y1="45" x2="130" y2="30" stroke="url(#purpleCyanGradDark)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9" />
    <line x1="105" y1="95" x2="130" y2="30" stroke="url(#purpleCyanGradDark)" stroke-width="1.5" stroke-dasharray="2,2" stroke-opacity="0.45" />

    <!-- Cross connections -->
    <line x1="80" y1="25" x2="80" y2="70" stroke="url(#purpleCyanGradDark)" stroke-width="2" stroke-opacity="0.7" />
    <line x1="80" y1="70" x2="55" y2="95" stroke="url(#purpleCyanGradDark)" stroke-width="2" stroke-opacity="0.7" />
    <line x1="80" y1="70" x2="105" y2="95" stroke="url(#purpleCyanGradDark)" stroke-width="2" stroke-opacity="0.7" />
    <line x1="40" y1="45" x2="75" y2="55" stroke="url(#purpleCyanGradDark)" stroke-width="1.5" stroke-opacity="0.6" />
    <line x1="120" y1="45" x2="85" y2="55" stroke="url(#purpleCyanGradDark)" stroke-width="1.5" stroke-opacity="0.6" />
    <line x1="50" y1="65" x2="80" y2="70" stroke="url(#purpleCyanGradDark)" stroke-width="1.5" stroke-opacity="0.6" />
    <line x1="110" y1="65" x2="80" y2="70" stroke="url(#purpleCyanGradDark)" stroke-width="1.5" stroke-opacity="0.6" />

    <!-- Nodes -->
    <circle cx="30" cy="30" r="5" fill="#1c1917" stroke="url(#purpleCyanGradDark)" stroke-width="2.5" />
    <circle cx="40" cy="45" r="5" fill="#1c1917" stroke="url(#purpleCyanGradDark)" stroke-width="2.5" />
    <circle cx="50" cy="65" r="5" fill="#1c1917" stroke="url(#purpleCyanGradDark)" stroke-width="2.5" />
    <circle cx="55" cy="95" r="6" fill="#1c1917" stroke="url(#purpleCyanGradDark)" stroke-width="3" />
    
    <circle cx="75" cy="55" r="5" fill="#1c1917" stroke="url(#purpleCyanGradDark)" stroke-width="2.5" />
    <circle cx="80" cy="25" r="6" fill="#1c1917" stroke="url(#purpleCyanGradDark)" stroke-width="3" />
    <circle cx="85" cy="55" r="5" fill="#1c1917" stroke="url(#purpleCyanGradDark)" stroke-width="2.5" />
    
    <circle cx="105" cy="95" r="6" fill="#1c1917" stroke="url(#purpleCyanGradDark)" stroke-width="3" />
    <circle cx="110" cy="65" r="5" fill="#1c1917" stroke="url(#purpleCyanGradDark)" stroke-width="2.5" />
    <circle cx="120" cy="45" r="5" fill="#1c1917" stroke="url(#purpleCyanGradDark)" stroke-width="2.5" />
    <circle cx="130" cy="30" r="5" fill="#1c1917" stroke="url(#purpleCyanGradDark)" stroke-width="2.5" />
    
    <circle cx="80" cy="70" r="5.5" fill="#1c1917" stroke="url(#purpleCyanGradDark)" stroke-width="2.5" />
  </g>
  
  <!-- Right Side: Text -->
  <text x="160" y="70" font-family="'Space Grotesk', system-ui, sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="-1px">
    WorkPilot<tspan font-weight="300" fill="#22d3ee">AI</tspan>
  </text>
</svg>
