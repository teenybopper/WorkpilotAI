name: "Publish Release"

on:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: ""
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libpipewire-0.3-dev

      - name: Install Frontend Dependencies (if package.json exists)
        run: test -f package.json && npm install || echo "No package.json found, skipping npm install"
        working-directory: ./WPAI-local

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Python Backend Executable (PyInstaller Sidecar)
        shell: bash
        run: |
          pip install pyinstaller uvicorn fastapi python-multipart pydantic-settings pydantic sqlalchemy chromadb openai sentence-transformers python-dotenv httpx passlib python-jose cryptography alembic
          cd backend
          pyinstaller --onefile --name workpilot-backend main.py
          mkdir -p ../WPAI-local/src-tauri/binaries
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/workpilot-backend.exe ../WPAI-local/src-tauri/binaries/workpilot-backend-x86_64-pc-windows-msvc.exe
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp dist/workpilot-backend ../WPAI-local/src-tauri/binaries/workpilot-backend-x86_64-apple-darwin
            cp dist/workpilot-backend ../WPAI-local/src-tauri/binaries/workpilot-backend-aarch64-apple-darwin
          else
            cp dist/workpilot-backend ../WPAI-local/src-tauri/binaries/workpilot-backend-x86_64-unknown-linux-gnu
          fi


      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "./WPAI-local"
          tagName: ${{ github.ref_name }}
          releaseName: "WorkPilot Companion v__VERSION__"
          releaseBody: "See the assets below to download the companion app installer for your operating system."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
